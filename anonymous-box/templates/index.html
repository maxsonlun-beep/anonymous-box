<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菠萝世界 - 匿名提问箱</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 50%, #f0fdf4 100%);
            color: #1e293b; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 480px; }
        .card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 32px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.6); text-align: center;
        }
        .avatar { font-size: 44px; margin-bottom: 10px; }
        h2 { margin: 0 0 8px 0; color: #0f172a; font-size: 24px; font-weight: 700; }
        p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        textarea {
            width: 100%; height: 110px; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 14px;
            resize: none; font-size: 14px; outline: none; background: rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease; color: #1e293b;
        }
        textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); background: #fff; }
        button {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none;
            padding: 14px; border-radius: 14px; width: 100%; margin-top: 14px; font-size: 15px; cursor: pointer; font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: all 0.2s ease;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
        
        /* 聊天历史气泡区 */
        .chat-history { text-align: left; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .chat-item { margin-bottom: 16px; background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .my-msg { background: #e0e7ff; color: #1e3a8a; padding: 10px 12px; border-radius: 10px; font-size: 13px; word-break: break-all; margin-bottom: 8px; }
        .reply-msg { background: #ffffff; color: #0f172a; padding: 10px 12px; border-radius: 10px; font-size: 13px; border-left: 3px solid #6366f1; word-break: break-all; line-height: 1.4; }
        .waiting-text { font-size: 12px; color: #64748b; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="avatar">🍍</div>
            <h2>菠萝世界</h2>
            <p>这里可以畅所欲言，有什么悄悄话或者问题，尽管写下来传达给我吧~</p>
            
            <form method="POST">
                <textarea name="content" placeholder="写下你的真实想法..." required></textarea>
                <button type="submit">匿名发送新消息</button>
            </form>

            <!-- 历史对话记录展示区 -->
            <div id="chatHistoryArea" class="chat-history" style="display: none;">
                <div style="font-size: 13px; font-weight: bold; color: #334155; margin-bottom: 12px;">💬 你的历史对话记录</div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        // 从 localStorage 读取保存的所有 token 列表
        let tokens = JSON.parse(localStorage.getItem('pineapple_tokens') || '[]');

        // 如果后端刚成功提交了一条新消息，把返回的新 token 压入数组并存回缓存
        {% if new_token %}
            let newToken = "{{ new_token }}";
            if (!tokens.includes(newToken)) {
                tokens.push(newToken);
                localStorage.setItem('pineapple_tokens', JSON.stringify(tokens));
            }
        {% endif %}

        // 如果本地有记录，异步向服务器请求这些消息的内容和回复
        if (tokens.length > 0) {
            fetch('/check_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tokens: tokens })
            })
            .then(res => res.json())
            .then(data => {
                if (data.history && data.history.length > 0) {
                    document.getElementById('chatHistoryArea').style.display = 'block';
                    let html = '';
                    data.history.forEach(item => {
                        html += `<div class="chat-item">
                            <div class="my-msg"><b>你：</b>${item.content}</div>`;
                        if (item.reply && item.reply.trim() !== '') {
                            html += `<div class="reply-msg"><b>🍍 菠萝回复：</b>${item.reply}</div>`;
                        } else {
                            html += `<div class="waiting-text">⏳ 正在等待菠萝回复...</div>`;
                        }
                        html += `</div>`;
                    });
                    document.getElementById('historyList').innerHTML = html;
                }
            });
        }
    </script>
</body>
</html>
