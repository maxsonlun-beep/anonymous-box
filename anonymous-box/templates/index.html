<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maxsonlun · 菠萝世界复合空间</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text: #0f172a;
            --sub: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --accent: #6366f1;
        }
        [data-theme="dark"] {
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --text: #f9fafb;
            --sub: #9ca3af;
            --border: rgba(31, 41, 55, 0.6);
            --accent: #818cf8;
        }
        * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        
        /* 动态氛围感极光背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh;
            position: relative; overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.1), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.1), transparent 50%);
            animation: auroraMove 15s ease infinite alternate;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes auroraMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 16px; z-index: 1; }
        
        /* 顶栏 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); backdrop-filter: blur(12px); padding: 16px 24px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
        .profile-info { display: flex; align-items: center; gap: 12px; }
        .avatar-box { font-size: 32px; background: rgba(99, 102, 241, 0.1); padding: 8px; border-radius: 14px; }
        .profile-info h1 { font-size: 18px; margin: 0; font-weight: 700; }
        .profile-info p { font-size: 12px; margin: 2px 0 0 0; color: var(--sub); }
        .theme-btn { background: var(--border); border: none; padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 13px; color: var(--text); }

        /* Bento 网格布局 */
        .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 640px) { .bento-grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); padding: 24px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
        .card-full { grid-column: span 2; }
        @media(max-width: 640px) { .card-full { grid-column: span 1; } }

        h3 { margin: 0 0 12px 0; font-size: 16px; display: flex; align-items: center; gap: 6px; }
        
        /* 表单与输入框 */
        .tags { display: flex; gap: 6px; margin-bottom: 12px; }
        .tag-pill { background: rgba(100, 116, 139, 0.1); border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; color: var(--sub); }
        .tag-pill.active { background: var(--accent); color: white; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.05); color: var(--text); resize: none; font-size: 14px; outline: none; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .submit-btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* 音乐与状态卡片组件 */
        .status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(34,197,94,0.1); color: #22c55e; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .music-box { display: flex; align-items: center; gap: 12px; background: rgba(100, 116, 139, 0.05); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
        .vinyl { font-size: 28px; animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 对话历史展示 */
        .chat-item { background: rgba(100, 116, 139, 0.05); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
        .my-text { font-size: 13px; color: var(--text); margin-bottom: 6px; }
        .reply-text { font-size: 13px; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 8px; }
    </style>
</head>
<body data-theme="dark">
    <div class="wrapper">
        <!-- 顶栏 -->
        <div class="top-bar">
            <div class="profile-info">
                <div class="avatar-box">🍍</div>
                <div>
                    <h1>maxsonlun</h1>
                    <p>Electrical Engineering & Tech Hub</p>
                </div>
            </div>
            <button class="theme-btn" onclick="toggleTheme()">☀️ 切换主题</button>
        </div>

        <!-- Bento 复合网格 -->
        <div class="bento-grid">
            
            <!-- 板块一：互动提问箱（全宽） -->
            <div class="card card-full">
                <h3>💌 匿名树洞与专属提问箱</h3>
                <p style="font-size: 13px; color: var(--sub); margin-top:0;">有什么悄悄话、意见或技术交流，随时发给我，下次进入自动同步回复。</p>
                <form method="POST">
                    <div class="tags">
                        <button type="button" class="tag-pill active" onclick="setTag('日常', this)">📌 日常</button>
                        <button type="button" class="tag-pill" onclick="setTag('技术', this)">⚡ 技术</button>
                        <button type="button" class="tag-pill" onclick="setTag('表白', this)">💖 表白</button>
                    </div>
                    <input type="hidden" name="tag" id="tagInput" value="日常">
                    <textarea name="content" placeholder="写下你的真实想法..." required></textarea>
                    <button type="submit" class="submit-btn">发送加密消息</button>
                </form>

                <!-- 历史消息展示区 -->
                <div id="historyArea" style="margin-top: 20px; display: none;">
                    <div style="font-size: 13px; font-weight: bold; margin-bottom: 10px;">💬 你的对话记录流</div>
                    <div id="historyList"></div>
                </div>
            </div>

            <!-- 板块二：个人实时状态 -->
            <div class="card">
                <div class="status-badge"><div class="dot"></div>系统正常运行</div>
                <h3 style="margin-top: 5px;">⚡ 数字看板</h3>
                <p style="font-size: 13px; color: var(--sub);">主修电气工程与自动化。热爱硬件电路、嵌入式与全栈开发。</p>
            </div>

            <!-- 板块三：音乐视听空间 -->
            <div class="card">
                <h3>🎵 氛围空间 (Trap/Drill)</h3>
                <div class="music-box">
                    <div class="vinyl">💿</div>
                    <div>
                        <div style="font-size: 13px; font-weight: bold;">Dark Ambient Drill 808</div>
                        <div style="font-size: 11px; color: var(--sub);">Coding & Engineering Vibes</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function setTag(t, btn) {
            document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tagInput').value = t;
        }

        function toggleTheme() {
            const body = document.body;
            const theme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        if (localStorage.getItem('theme')) {
            document.body.setAttribute('data-theme', localStorage.getItem('theme'));
        }

        // 自动同步历史对话
        let tokens = JSON.parse(localStorage.getItem('pineapple_tokens') || '[]');
        {% if new_token %}
            let nt = "{{ new_token }}";
            if (!tokens.includes(nt)) {
                tokens.push(nt);
                localStorage.setItem('pineapple_tokens', JSON.stringify(tokens));
            }
        {% endif %}

        if (tokens.length > 0) {
            fetch('/check_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tokens: tokens })
            })
            .then(res => res.json())
            .then(data => {
                if (data.history && data.history.length > 0) {
                    document.getElementById('historyArea').style.display = 'block';
                    let h = '';
                    data.history.forEach(item => {
                        h += `<div class="chat-item">
                            <div class="my-text"><b>[${item.tag}] 你：</b>${item.content}</div>`;
                        if (item.reply && item.reply.trim() !== '') {
                            h += `<div class="reply-text"><b>菠萝回复：</b>${item.reply}</div>`;
                        } else {
                            h += `<div style="font-size: 12px; color: var(--sub); font-style: italic;">⏳ 等待菠萝回复中...</div>`;
                        }
                        h += `</div>`;
                    });
                    document.getElementById('historyList').innerHTML = h;
                }
            });
        }
    </script>
</body>
</html>
