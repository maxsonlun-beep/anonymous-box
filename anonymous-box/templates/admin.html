<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 菠萝世界</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px 20px; max-width: 700px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #334155; }
        .meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .content { font-size: 15px; margin-bottom: 12px; word-break: break-all; }
        textarea { width: 100%; height: 70px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; padding: 8px; resize: none; margin-bottom: 8px; }
        button { background: #6366f1; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .reply-box { background: #0f172a; border-left: 3px solid #3b82f6; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
        .badge-type { background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
    </style>
</head>
<body>
    <h2>🍍 菠萝世界复合空间 · 管理后台</h2>
    <hr style="border:0; border-top:1px solid #334155; margin-bottom: 20px;">
    
    {% for msg in messages %}
    <div class="card">
        <div class="meta">
            <span>
                {% if msg.msg_type == 'private' %}<span class="badge-type" style="background:#e60026;">专属私密</span>{% else %}<span class="badge-type">论坛广场</span>{% endif %}
                📍 {{ msg.location }} (IP: <b>{{ msg.ip }}</b>)
            </span>
            <span>🕒 {{ msg.created_at }}</span>
        </div>
        <div class="content">💬 {{ msg.content }}</div>
        
        {% if msg.reply %}
        <div class="reply-box"><b>当前回复：</b>{{ msg.reply }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="msg_id" value="{{ msg.id }}">
            <textarea name="reply" placeholder="写下你的回复..."></textarea>
            <button type="submit">提交回复</button>
        </form>
    </div>
    {% else %}
    <p style="text-align: center; color: #94a3b8; margin-top: 50px;">暂无任何消息~</p>
    {% endfor %}
</body>
</html>
